services:
  toolbox:
    build: .
    image: toolbox
    container_name: toolbox
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SCHEME: ${SCHEME:-http}
    volumes:
      # Persist TLS certificates and Caddy state across restarts
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
